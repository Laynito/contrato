server {
    listen 80;
    server_name contrato.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name contrato.example.com;

    # Configure certificados TLS del host antes de habilitar este bloque.
    ssl_certificate /etc/letsencrypt/live/contrato.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contrato.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
